<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="Tour Zimbabwe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tour Zimbabwe</title>
  <defs>
    <clipPath id="tz-emblem">
      <circle cx="100" cy="100" r="62"/>
    </clipPath>
  </defs>

  <!-- Emblem -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#C9A24B" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="62" fill="#0B3D2E"/>

  <g clip-path="url(#tz-emblem)">
    <!-- Sun -->
    <circle cx="100" cy="86" r="24" fill="#C9A24B"/>
    <!-- Great Zimbabwe conical tower -->
    <path d="M82 140 L89 92 Q100 85 111 92 L118 140 Z" fill="#F6F1E7"/>
    <path d="M85.5 112 L114.5 112" stroke="#0B3D2E" stroke-width="1.5"/>
    <path d="M84 126 L116 126" stroke="#0B3D2E" stroke-width="1.5"/>
    <!-- Enclosure wall / horizon -->
    <path d="M30 140 Q65 128 82 134 L118 134 Q135 128 170 140 L170 170 L30 170 Z" fill="#C9A24B"/>
  </g>

  <!-- Wordmark -->
  <text x="196" y="90" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="9" fill="#C9A24B">TOUR</text>
  <text x="194" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="600" letter-spacing="5" fill="#0B3D2E">ZIMBABWE</text>
  <line x1="196" y1="148" x2="244" y2="148" stroke="#C9A24B" stroke-width="1.5"/>
</svg>
